# ───────────────────────────────────────────────────────────────
#  발표 헤드라인 자동 갱신 — data/release.json
#  매월 1·11·21일(KST 09~13시) KDI EIEC/뉴스에서 "수출입 현황" 수집
#  → Claude 파싱 → 스키마 검증 → 변경 시 자동 PR(사람이 1-클릭 머지)
#
#  필요 설정:
#   - Secret  ANTHROPIC_API_KEY            (필수)
#   - Settings → Actions → General → "Allow GitHub Actions to create pull requests" 체크
#   - (선택) Variable RELEASE_SOURCE_LIST_URL  소스 목록 URL 오버라이드
# ───────────────────────────────────────────────────────────────
name: Release auto-update

on:
  schedule:
    # cron은 UTC. 00~04시 UTC = 09~13시 KST, 매월 1·11·21일 매시 정각
    - cron: '0 0-4 1,11,21 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch & parse latest release
        id: fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASE_SOURCE_LIST_URL: ${{ vars.RELEASE_SOURCE_LIST_URL }}
        # 성공(갱신/no-op)=exit0, 하드실패=exit2. 실패해도 PR 스텝까지는 진행하고
        # (변경 없음 → no-op), 마지막 스텝에서 잡을 실패로 표시해 눈에 띄게 한다.
        continue-on-error: true
        run: python scripts/fetch_release.py

      - name: Open PR if release.json changed
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: auto/release-update
          delete-branch: true
          add-paths: data/release.json
          commit-message: 'data: release.json 자동 갱신'
          title: 'data: 수출입 발표 자동 갱신 (검토 후 머지)'
          body: |
            `fetch_release.py` 자동 수집·파싱 결과입니다.

            **숫자를 확인한 뒤 머지하세요.** 출처는 `data/release.json`의 `source_url`을 참고하세요.
            변경 사항이 없으면 이 PR은 생성되지 않습니다(자동 수집 실패 시 `scripts/parse_release.py` 수동 폴백 사용).

      - name: Fail job if fetch hard-failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::fetch_release.py 하드 실패(exit 2) — 위 'Fetch & parse latest release' 스텝의 stderr를 확인하세요. 수동 폴백: python scripts/parse_release.py --url <EIEC 글 URL>"
          echo "## ❌ 발표 자동 갱신 실패" >> "$GITHUB_STEP_SUMMARY"
          echo "\`fetch_release.py\` 가 exit 2 로 종료됐습니다. Secret \`ANTHROPIC_API_KEY\` 설정 여부와 로그의 stderr를 확인하세요." >> "$GITHUB_STEP_SUMMARY"
          exit 1
